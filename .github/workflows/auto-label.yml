---
name: Auto Label

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

jobs:
  auto_label:
    name: Auto Label
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - name: Label pull request
        uses: release-drafter/release-drafter/autolabeler@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
